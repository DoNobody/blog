version: "2"

services:
  blog-redis:
    container_name: blog-redis
    image: redis:6.2-alpine
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data/
    command: "redis-server --save 20 1 --loglevel warning --requirepass root"
    networks:
      - blog-redis
    restart: always

networks:
  blog-redis:
    name: blog-redis
    driver: bridge

volumes:
  redis-data:
    external: true